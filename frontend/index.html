<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LeBron's Legacy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- Bootstrap (unchanged) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      /* ring color tuned for purple */
      --ring: rgba(147, 51, 234, 0.25); /* ~purple-600 */
    }
    img { image-rendering: auto; }
  </style>
</head>
<body class="font-inter bg-black text-zinc-100 antialiased">

  <!-- Subtle purple glow background -->
  <div class="fixed inset-0 -z-10 bg-purple-glow pointer-events-none"></div>

  <header class="sticky top-0 z-40 w-full border-b border-zinc-800 bg-black/80 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-7xl items-center px-6 md:px-8">
      <a class="mr-6 inline-flex items-center gap-2" href="#">
        <img src="./static/logo.png" class="h-10 w-10 rounded-md shadow-soft" alt="Logo">
      </a>

      <nav class="hidden w-full md:block">
        <ul class="flex items-center justify-center gap-4 font-semibold text-zinc-200">
          <li><a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_main">Home</a></li>
          <li><a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_shop">Shop</a></li>
          <li><a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_basketballs">Basketballs</a></li>
          <li><a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_jerseys">Jerseys</a></li>
          <li><a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_apparel">Apparel</a></li>
          
        </ul>
      </nav>

      <p class="font-semibold">
        <a class="border-b-2 border-transparent pb-1 hover:border-brand-500 hover:text-brand-400 transition" href="#view_login">
          Login
        </a>
      </p>
    </div>
  </header>

  <main id="spapp" role="main">
    <!-- Your SPA sections (unchanged structure) -->
    <section id="view_main"></section>
    <section id="view_jerseys"></section>
    <section id="view_basketballs"></section>
    <section id="view_apparel"></section>
    <section id="view_shop"></section>

    <section id="view_login"></section>
    <section id="view_signup"></section>
    <section id="view_item"></section>
  </main>

  <footer class="border-t border-zinc-800 bg-black">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-8 text-sm text-zinc-400 md:px-8">
      <p>© <span id="year"></span> Sneakers Co.</p>
      <div class="flex items-center gap-6">
        <a href="#" class="hover:text-brand-400">Privacy</a>
        <a href="#" class="hover:text-brand-400">Terms</a>
        <a href="#" class="hover:text-brand-400">Support</a>
      </div>
    </div>
  </footer>

  <!-- Scripts (kept as-is; fixed a stray quote on custom.js) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-..." crossorigin="anonymous"></script>
  <script src="./js/itemview.js"></script>
  <script src="./js/signup.js"></script>
  <script src="./js/jquery.spapp.js"></script>
  <script src="./js/jquery.spapp.min.js"></script>
  <script src="./js/custom.js"></script>
  <script src="./js/tailwindconfig.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
