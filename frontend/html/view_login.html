<section id="login" class="min-h-screen bg-black text-white">
  <div class="mx-auto flex min-h-screen max-w-7xl items-center justify-center px-6 md:px-8">
    <!-- Login Card -->
    <div class="w-full max-w-md overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-900/40 p-6">
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Log in</h1>
      <p class="mt-1 text-sm text-zinc-400">
        New here?
        <a href="#view_signup" class="font-semibold text-purple-400 hover:underline">Create an account</a>
      </p>

      <form class="mt-6 space-y-4" autocomplete="on">
        <!-- Email -->
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-zinc-300">Email</label>
          <input
            id="email"
            type="email"
            required
            class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
            placeholder="you@example.com" />
        </div>

        <!-- Password -->
        <div>
          <div class="mb-1 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-zinc-300">Password</label>
            <a href="#/home" class="text-sm font-semibold text-purple-400 hover:underline">Forgot?</a>
          </div>
          <input
            id="password"
            type="password"
            required
            class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
            placeholder="••••••••" />
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-sm text-zinc-300">
            <input type="checkbox" class="h-4 w-4 rounded border-zinc-700 bg-black text-purple-600 focus:ring-purple-600/40" />
            Remember me
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="inline-flex w-full items-center justify-center rounded-2xl bg-purple-600 px-6 py-3.5 text-sm font-semibold text-white shadow-sm ring-1 ring-purple-800/20 transition hover:bg-purple-700 active:scale-[0.98]">
          Continue
        </button>

        <!-- Or divider -->
        <div class="flex items-center gap-3">
          <div class="h-px w-full bg-zinc-800"></div>
          <span class="text-xs font-medium text-zinc-500">or</span>
          <div class="h-px w-full bg-zinc-800"></div>
        </div>

        <!-- Socials -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="rounded-xl border border-zinc-800 bg-black px-4 py-2.5 text-sm font-semibold text-zinc-100 hover:border-zinc-700 hover:shadow-sm">
            Google
          </button>
          <button type="button" class="rounded-xl border border-zinc-800 bg-black px-4 py-2.5 text-sm font-semibold text-zinc-100 hover:border-zinc-700 hover:shadow-sm">
            Apple
          </button>
        </div>
      </form>

      <p class="mt-4 text-xs text-zinc-500">
        By continuing, you agree to our
        <a href="#terms" class="font-medium text-purple-400 hover:underline">Terms</a> and
        <a href="#privacy" class="font-medium text-purple-400 hover:underline">Privacy Policy</a>.
      </p>
    </div>
  </div>
</section>
