<section id="signup" class="min-h-screen bg-black text-white">
  <div class="mx-auto flex  grid-cols-1 items-center justify-center gap-8 px-6 py-16 md:grid-cols-2 md:px-8">


    <!-- Sign Up Card -->
    <div class="order-1 md:order-2">
      <div class="mx-auto w-full max-w-md overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-900/40 p-6 ring-1 ring-transparent transition">
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Sign up</h1>
        <p class="mt-1 text-sm text-zinc-400">
          Already have an account?
          <a href="#login" class="font-semibold text-purple-400 hover:underline">Log in</a>
        </p>

        <form id="signupForm" class="mt-6 space-y-4" novalidate>
          <!-- Name -->
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label for="firstName" class="mb-1 block text-sm font-medium text-zinc-300">First name</label>
              <input id="firstName" type="text" required
                     class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
                     placeholder="Michael" />
            </div>
            <div>
              <label for="lastName" class="mb-1 block text-sm font-medium text-zinc-300">Last name</label>
              <input id="lastName" type="text" required
                     class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
                     placeholder="Jordan" />
            </div>
          </div>

          <!-- Email -->
          <div>
            <label for="emailSignup" class="mb-1 block text-sm font-medium text-zinc-300">Email</label>
            <input id="emailSignup" type="email" required
                   class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
                   placeholder="you@example.com" />
          </div>

          <!-- Password -->
          <div>
            <label for="passwordSignup" class="mb-1 block text-sm font-medium text-zinc-300">Password</label>
            <div class="relative">
              <input id="passwordSignup" type="password" required minlength="8"
                     class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 pr-12 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
                     placeholder="At least 8 characters" />
              <button type="button" id="togglePw1"
                      class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg border border-zinc-800 bg-black px-2 py-1 text-xs font-semibold text-zinc-200 hover:bg-zinc-900">
                Show
              </button>
            </div>

            <!-- Strength meter -->
            <div class="mt-3">
              <div class="h-2 w-full rounded-full bg-zinc-800">
                <div id="pwStrengthBar" class="h-full w-[10%] rounded-full bg-purple-600 transition-all"></div>
              </div>
              <p id="pwStrengthText" class="mt-1 text-xs font-medium text-zinc-400">Strength: Weak</p>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="passwordConfirm" class="mb-1 block text-sm font-medium text-zinc-300">Confirm password</label>
            <div class="relative">
              <input id="passwordConfirm" type="password" required minlength="8"
                     class="block w-full rounded-xl border border-zinc-800 bg-black px-4 py-3 pr-12 text-zinc-100 placeholder-zinc-500 outline-none focus:border-zinc-700 focus:ring-2 focus:ring-purple-600/30"
                     placeholder="Repeat your password" />
              <button type="button" id="togglePw2"
                      class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg border border-zinc-800 bg-black px-2 py-1 text-xs font-semibold text-zinc-200 hover:bg-zinc-900">
                Show
              </button>
            </div>
            <p id="pwMatchText" class="mt-1 text-xs font-medium"></p>
          </div>

          <!-- Preferences (optional) -->
          <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
            <div>
              <label for="shoeSize" class="mb-1 block text-sm font-medium text-zinc-300">Shoe size (optional)</label>
              <select id="shoeSize"
                      class="w-full rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-purple-600/30">
                <option value="">Select</option>
                <option>EU 41</option><option>EU 42</option><option>EU 43</option>
                <option>EU 44</option><option>EU 45</option>
              </select>
            </div>
            <div>
              <label for="favStyle" class="mb-1 block text-sm font-medium text-zinc-300">Favorite style (optional)</label>
              <select id="favStyle"
                      class="w-full rounded-xl border border-zinc-800 bg-black px-3 py-3 text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-purple-600/30">
                <option value="">Select</option>
                <option>Sneakers</option><option>Running</option><option>Basketball</option><option>Lifestyle</option>
              </select>
            </div>
          </div>

          <!-- Terms -->
          <div class="flex items-start gap-3">
            <input id="terms" type="checkbox" required
                   class="mt-1 h-4 w-4 rounded border-zinc-700 bg-black text-purple-600 focus:ring-purple-600/40" />
            <label for="terms" class="text-sm text-zinc-300">
              I agree to the <a href="#terms" class="font-medium text-purple-400 hover:underline">Terms</a> and
              <a href="#privacy" class="font-medium text-purple-400 hover:underline">Privacy Policy</a>.
            </label>
          </div>

          <!-- Submit -->
          <button type="submit"
                  class="inline-flex w-full items-center justify-center rounded-2xl bg-purple-600 px-6 py-3.5 text-sm font-semibold text-white shadow-sm ring-1 ring-purple-800/20 transition hover:bg-purple-700 active:scale-[0.98]">
            Create account
          </button>

          <!-- Or divider -->
          <div class="flex items-center gap-3">
            <div class="h-px w-full bg-zinc-800"></div>
            <span class="text-xs font-medium text-zinc-500">or</span>
            <div class="h-px w-full bg-zinc-800"></div>
          </div>

          <!-- Socials -->
          <div class="grid grid-cols-2 gap-3">
            <button type="button"
                    class="rounded-xl border border-zinc-800 bg-black px-4 py-2.5 text-sm font-semibold text-zinc-100 hover:border-zinc-700 hover:shadow-sm">
              Sign up with Google
            </button>
            <button type="button"
                    class="rounded-xl border border-zinc-800 bg-black px-4 py-2.5 text-sm font-semibold text-zinc-100 hover:border-zinc-700 hover:shadow-sm">
              Sign up with Apple
            </button>
          </div>
        </form>

        <!-- Helper text -->
        <p class="mt-4 text-xs text-zinc-500">
          We’ll send you product updates and exclusive launches. You can opt out anytime.
        </p>
      </div>

      <!-- Toast (dark) -->
      <div id="signupToast"
           class="pointer-events-none fixed inset-x-0 bottom-6 z-50 mx-auto hidden w-fit rounded-xl border border-zinc-800 bg-zinc-900/90 px-4 py-3 text-sm text-white shadow-md">
        Account created — welcome!
      </div>
    </div>
  </div>
</section>
